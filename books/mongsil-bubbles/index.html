<title>몽실몽실 비눗방울</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* layout: a dummy-book viewer — every row is one opened spread (left page | right page), so rows always line up */
:root{
  --bg:#edf3f8; --surface:#ffffff; --fg:#22303b; --muted:#5a6976; --line:#d2dde7;
  --accent:#2f78c9; --on-accent:#ffffff; --chip:#e1ebf5;
  --art-ink:#3b302b; --art-light:#ffffff; --blank:#efe8da; --blank-ink:#8f846f;
  --font-book:'Gaegu','Gowun Dodum',system-ui,sans-serif;
  --font-ui:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121920; --surface:#1b242d; --fg:#e4ecf3; --muted:#9aa9b6; --line:#2b3844;
    --accent:#7db6ee; --on-accent:#0f1b26; --chip:#22303c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121920; --surface:#1b242d; --fg:#e4ecf3; --muted:#9aa9b6; --line:#2b3844;
  --accent:#7db6ee; --on-accent:#0f1b26; --chip:#22303c; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 56px}
header h1{font-family:var(--font-book);font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tabs button{font:inherit;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* one opened spread */
.row{container:row / inline-size;min-width:0}
.row .lab{font-size:14px;color:var(--muted);margin-bottom:6px}
.row .lab b{color:var(--fg);font-weight:700}
.spreadbox{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,40,60,.10),0 10px 28px rgba(20,50,80,.14)}
.spreadbox.full{grid-template-columns:1fr}
.spreadbox::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 7px);width:14px;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.15) 50%,rgba(0,0,0,0))}
.sheet{position:relative;container-type:inline-size;min-width:0;background:var(--art-light)}
.sheet svg{display:block;width:100%;height:auto}
.sheet.blank{aspect-ratio:800/560;background:var(--blank);display:flex;align-items:center;justify-content:center;
  color:var(--blank-ink);font-family:var(--font-book);font-size:clamp(14px,4cqw,26px)}
.txt{--u:1cqw;position:absolute;font-family:var(--font-book);font-weight:700;color:var(--art-ink);
  font-size:calc(var(--u) * 3.6);line-height:1.38;text-wrap:pretty}
.sheet.full .txt{--u:.5cqw}
.txt.light{color:var(--art-light);text-shadow:0 1px 3px rgba(20,60,110,.55)}
.txt.title{font-size:calc(var(--u) * 8.6);line-height:1.1;text-align:center}
.txt.title small{display:block;font-size:.34em;font-weight:400;margin-top:.5em}
.txt.big{font-size:calc(var(--u) * 6.4)}
.txt p{margin:0 0 .35em}
.recipe .rt{font-size:1.4em;margin-bottom:.3em}
.recipe .rs{font-weight:400;margin-bottom:.5em}
.recipe ol{list-style:none;margin:0;padding:0;display:grid;gap:.12em}
/* the story text under the picture, used whenever the picture is too small to read text on it */
.cap{display:none;margin-top:10px;font-family:var(--font-book);font-size:20px;line-height:1.45}
.cap p{margin:0 0 6px}
.cap b{font-family:var(--font-ui);font-weight:400;font-size:13px;color:var(--muted);margin-right:6px;
  display:inline-block;padding:0 7px;border-radius:999px;background:var(--chip);vertical-align:2px}
.rmemo{display:none}
@container row (max-width: 880px){ .txt{display:none} .cap{display:block} }

.stage{max-width:1000px;margin:0 auto}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px auto 0;max-width:1000px}
.controls button{font:inherit;padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-width:96px}
.controls button:disabled{opacity:.4;cursor:default}
.pos{font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.pos b{color:var(--fg);font-weight:400}
.memo{max-width:1000px;margin:18px auto 0;padding:14px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.memo h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:400}
.memo p{margin:0}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent)}

.tip{margin:0 0 20px;padding:12px 16px;border-radius:12px;background:var(--chip);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 22px}
.cell{display:block;align-self:start;min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}

.cast h2{font-family:var(--font-book);font-size:28px;margin:4px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card .por{background:#dff0fc;border-radius:10px;display:flex;justify-content:center}
.card .por svg{width:62%;height:auto;display:block}
.card h3{font-family:var(--font-book);font-size:26px;margin:10px 0 0}
.card .why{color:var(--muted);margin:2px 0 8px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.card li{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);flex:none}
.chg{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--fg);margin-left:4px}
.adults{margin-top:26px}
.adults .card .por svg{width:44%}
.note{margin-top:22px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.stage .spreadbox{animation:fade .25s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

<div class="wrap">
  <header>
    <h1>몽실몽실 비눗방울</h1>
    <p>그림책 더미(시안) · 표지와 15쪽 · 펼친 두 쪽씩 보기</p>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-flip" aria-selected="true">넘겨 보기</button>
    <button role="tab" id="t-grid" aria-selected="false">한눈에 보기</button>
    <button role="tab" id="t-cast" aria-selected="false">등장인물</button>
  </div>

  <section id="v-flip">
    <div class="stage" id="stage"></div>
    <div class="controls">
      <button id="prev">← 이전</button>
      <div class="pos" id="pos"></div>
      <button id="next">다음 →</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="memo"><h3>구성 메모</h3><p id="memo"></p></div>
  </section>

  <section id="v-grid" hidden>
    <p class="tip">책을 펼치면 왼쪽은 짝수 쪽, 오른쪽은 홀수 쪽이에요. 그래서 두 쪽을 한 그림으로 쓰는 펼침면은 늘 6–7쪽, 12–13쪽처럼 짝수–홀수 자리에 와요. 한 줄이 펼친 책 한 번이에요.</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-cast" class="cast" hidden>
    <h2>세 친구</h2>
    <div class="cards" id="kids"></div>
    <div class="adults">
      <h2>어른들</h2>
      <div class="cards" id="grown"></div>
    </div>
    <p class="note">옷 색은 세 아이가 그림에서 한눈에 구별되도록 조금 바꿨어요. 바뀐 곳에는 ‘변경’ 표시가 있어요.</p>
  </section>
</div>

<script>

const INK='#3b302b';
let P='';
const R=n=>Math.round(n*10)/10;
const D=Math.PI/180;
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const ST=`stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"`;

const K={
  nari:{name:'나리',top:'#8a5cc4',pants:'#8a5cc4',hair:'#3b2a20',style:'bob',pin:'#f5c518',skin:'#f7d9c0',stripe:true,wand:'#f5c518'},
  sol:{name:'솔이',top:'#f39ab8',pants:'#7fa7d6',hair:'#2a1d16',style:'pony',streak:'#4fcfae',tie:'#f06d9b',skin:'#f5d3b8',wand:'#f06d9b'},
  dahong:{name:'다홍',top:'#a9abb0',pants:'check',hair:'#4a3020',style:'long',pin:'#e23b3b',skin:'#f8dcc6',wand:'#e23b3b'}
};
const A={
  dad:{coat:'#4f7a5a',pants:'#3d4250',hair:'#2b211c',style:'short',glasses:true,skin:'#f1cfb2'},
  narimom:{coat:'#d6bc94',pants:'#5b4f6b',hair:'#3a2a22',style:'bob',skin:'#f6d6bd'},
  solmom:{coat:'#e0a53a',pants:'#47566e',hair:'#2a1e18',style:'long',skin:'#f3d0b4',bag:'#4f9e8a'},
  hongmom:{coat:'#34507a',pants:'#7a6a5a',hair:'#4a3020',style:'bun',skin:'#f7d9c3'}
};
const AUT={o:['#e9894a','#f2b545','#d9603b'],y:['#f2c14e','#e9a93a','#f5d76e'],r:['#d9533b','#e9894a','#c8413f'],d:['#b8643a','#c98a3a','#a24a30']};

function defs(){return `<defs>
<radialGradient id="${P}bub" cx="35%" cy="30%" r="72%">
 <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#fff" stop-opacity=".3"/>
 <stop offset=".7" stop-color="#d6ecff" stop-opacity=".22"/><stop offset=".88" stop-color="#f2c4ff" stop-opacity=".55"/>
 <stop offset="1" stop-color="#aef0dc" stop-opacity=".85"/></radialGradient>
<pattern id="${P}check" width="12" height="12" patternUnits="userSpaceOnUse">
 <rect width="12" height="12" fill="#cc4a46"/><rect width="6" height="12" fill="#2f3f66" opacity=".5"/><rect width="12" height="6" fill="#2f3f66" opacity=".5"/></pattern>
<linearGradient id="${P}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ab8ee"/><stop offset="1" stop-color="#cde9fc"/></linearGradient>
<linearGradient id="${P}deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a86d8"/><stop offset="1" stop-color="#a9d7f8"/></linearGradient>
<linearGradient id="${P}eve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a27a"/><stop offset=".7" stop-color="#fbd6a6"/><stop offset="1" stop-color="#fde8c4"/></linearGradient>
</defs>`}

/* ---------- small parts ---------- */
const limb=(x1,y1,x2,y2,c,w)=>`<line x1="${R(x1)}" y1="${R(y1)}" x2="${R(x2)}" y2="${R(y2)}" stroke="${INK}" stroke-width="${w+4.5}" stroke-linecap="round"/><line x1="${R(x1)}" y1="${R(y1)}" x2="${R(x2)}" y2="${R(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const sky=(w,h,id='sky')=>`<rect width="${w}" height="${h}" fill="url(#${P}${id})"/>`;
const ground=(w,h,y,c='#cbd88a')=>`<path d="M0,${y} Q${w*.25},${y-22} ${w*.5},${y} T${w},${y-6} V${h} H0Z" fill="${c}" ${ST}/>`;
const tree=(x,y,s,c=AUT.o)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-9,0 L-6,-95 H6 L9,0Z" fill="#8a5a3c" ${ST}/><circle cx="-38" cy="-100" r="40" fill="${c[1]}" ${ST}/><circle cx="38" cy="-104" r="42" fill="${c[2]}" ${ST}/><circle cx="0" cy="-140" r="50" fill="${c[0]}" ${ST}/></g>`;
const cloud=(x,y,s)=>`<path transform="translate(${x},${y}) scale(${s})" d="M-62,0 Q-64,-28 -34,-28 Q-26,-52 4,-46 Q26,-62 46,-38 Q74,-36 66,0Z" fill="#fff" opacity=".9"/>`;
const bubble=(x,y,r)=>`<circle cx="${R(x)}" cy="${R(y)}" r="${R(r)}" fill="url(#${P}bub)" stroke="#86bde9" stroke-width="1.6"/><path d="M${R(x-r*.55)},${R(y-r*.1)} A${R(r*.6)},${R(r*.6)} 0 0 1 ${R(x-r*.1)},${R(y-r*.58)}" stroke="#fff" stroke-width="${R(Math.max(1.4,r*.12))}" fill="none" stroke-linecap="round"/>`;
function bubbles(n,x0,y0,x1,y1,r0,r1,seed,avoid){const r=rng(seed);let s='';let k=0,t=0;while(k<n&&t<n*20){t++;const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0),rr=r0+Math.pow(r(),1.6)*(r1-r0);if(avoid&&avoid(x,y,rr))continue;s+=bubble(x,y,rr);k++}return s}
const leafShape=(x,y,rot,c,sz=1)=>`<path transform="translate(${R(x)},${R(y)}) rotate(${R(rot)}) scale(${sz})" d="M0,-9 Q8,0 0,9 Q-8,0 0,-9Z" fill="${c}" stroke="${INK}" stroke-width="1.4"/>`;
function leaves(n,x0,y0,x1,y1,seed){const r=rng(seed),cs=[...AUT.o,...AUT.y,...AUT.r];let s='';for(let i=0;i<n;i++)s+=leafShape(x0+r()*(x1-x0),y0+r()*(y1-y0),r()*360,cs[Math.floor(r()*cs.length)],.8+r()*.5);return s}
const acorn=(x,y,s=1)=>`<g transform="translate(${R(x)},${R(y)}) scale(${s})"><ellipse cx="0" cy="3" rx="6" ry="7.5" fill="#b07a45" ${ST}/><path d="M-7.5,0 Q0,-9 7.5,0Z" fill="#6e4a2a" ${ST}/></g>`;
const pinecone=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><ellipse rx="8" ry="11" fill="#8a5a3c" ${ST}/><path d="M-6,-4 Q0,0 6,-4 M-7,2 Q0,6 7,2 M-5,7 Q0,10 5,7" stroke="${INK}" stroke-width="1.3" fill="none"/></g>`;
const bang=(x,y,size=44,c='#e4572e')=>`<text x="${x}" y="${y}" font-family="Gaegu, sans-serif" font-weight="700" font-size="${size}" fill="${c}" text-anchor="middle">!</text>`;
const sun=(x,y,r,c='#ffd36e')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;

/* items held in hands (local coords of the figure) */
const wand=c=>(hx,hy)=>`<line x1="${R(hx)}" y1="${R(hy)}" x2="${R(hx-22)}" y2="${R(hy-6)}" stroke="${INK}" stroke-width="6.5" stroke-linecap="round"/><line x1="${R(hx)}" y1="${R(hy)}" x2="${R(hx-22)}" y2="${R(hy-6)}" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${R(hx-31)}" cy="${R(hy-8)}" r="9" fill="none" stroke="${INK}" stroke-width="6"/><circle cx="${R(hx-31)}" cy="${R(hy-8)}" r="9" fill="none" stroke="${c}" stroke-width="3"/>`;
const candy=(hx,hy)=>bubble(hx,hy-15,11);
const leafIt=(hx,hy)=>leafShape(hx+2,hy-10,30,'#d9533b',1.5);
const acornIt=(hx,hy)=>acorn(hx,hy-10,1.2);
const pop=(hx,hy)=>{let s='';for(let i=0;i<8;i++){const a=i*45*D;s+=`<line x1="${R(hx+Math.cos(a)*13)}" y1="${R(hy-14+Math.sin(a)*13)}" x2="${R(hx+Math.cos(a)*22)}" y2="${R(hy-14+Math.sin(a)*22)}" stroke="#5aa6e6" stroke-width="2.6" stroke-linecap="round"/>`}return s+`<circle cx="${R(hx)}" cy="${R(hy-14)}" r="5" fill="#fff" stroke="#86bde9" stroke-width="1.4"/>`};
function bottles(x,y){const cs=[['#e7dbff','#8a5cc4'],['#ffe1ec','#f06d9b'],['#ffe0dc','#e23b3b']];let s='';cs.forEach(([b,c],i)=>{const bx=x+(i-1)*22,by=y-Math.abs(i-1)*-6,rot=(i-1)*14;
  s+=`<g transform="translate(${R(bx)},${R(by)}) rotate(${rot})"><line x1="0" y1="-40" x2="0" y2="-54" stroke="${c}" stroke-width="3"/><circle cx="0" cy="-62" r="8" fill="none" stroke="${c}" stroke-width="3"/><rect x="-9" y="-34" width="18" height="34" rx="5" fill="${b}" ${ST}/><rect x="-7" y="-42" width="14" height="9" rx="2" fill="${c}" ${ST}/></g>`});
  [[-46,-60],[48,-66],[-36,-92],[38,-96],[0,-104]].forEach(([dx,dy])=>{s+=`<path d="M${x+dx},${y+dy-7} V${y+dy+7} M${x+dx-7},${y+dy} H${x+dx+7}" stroke="#f2b545" stroke-width="3" stroke-linecap="round"/>`});return s}
const tote=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-22,-58 Q-22,-86 0,-86 Q22,-86 22,-58" fill="none" stroke="${INK}" stroke-width="3.5"/><rect x="-24" y="-74" width="16" height="22" rx="3" fill="#fff1b8" ${ST}/><rect x="2" y="-70" width="20" height="18" rx="3" fill="#ffd1dc" ${ST}/><path d="M-42,0 L-35,-60 H35 L42,0Z" fill="#4f9e8a" ${ST}/></g>`;
function lunchbox(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-58" y="-36" width="116" height="42" rx="8" fill="#f6e7c8" ${ST}/><line x1="0" y1="-36" x2="0" y2="6" stroke="${INK}" stroke-width="2"/>`
  +leafShape(-40,-16,40,'#d9533b',1.3)+leafShape(-24,-20,-30,'#f2c14e',1.3)+leafShape(-14,-10,80,'#e9894a',1)
  +acorn(16,-18)+acorn(30,-12)+pinecone(46,-15,.9)+`<rect x="70" y="-6" width="60" height="10" rx="4" fill="#f9d8a8" ${ST} transform="rotate(-8 100 0)"/></g>`}
const bench=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-96" y="-50" width="10" height="50" fill="#7a4e30" ${ST}/><rect x="86" y="-50" width="10" height="50" fill="#7a4e30" ${ST}/><rect x="-106" y="-92" width="212" height="14" rx="4" fill="#b8784a" ${ST}/><rect x="-110" y="-52" width="220" height="14" rx="4" fill="#c98a55" ${ST}/></g>`;

/* ---------- people ---------- */
function face(m){
  const blush=`<ellipse cx="-19" cy="-113" rx="6" ry="3.5" fill="#f29a9a" opacity=".75"/><ellipse cx="19" cy="-113" rx="6" ry="3.5" fill="#f29a9a" opacity=".75"/>`;
  const dot=(x,r=3.4)=>`<circle cx="${x}" cy="-124" r="${r}" fill="${INK}"/>`;
  const arc=d=>`<path d="${d}" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  let e,mo;
  if(m==='wow'){e=dot(-11,4.3)+dot(11,4.3)+`<circle cx="-9.6" cy="-125.6" r="1.4" fill="#fff"/><circle cx="12.4" cy="-125.6" r="1.4" fill="#fff"/>`;mo=`<ellipse cx="0" cy="-109" rx="5" ry="6.5" fill="#b9504a" ${ST}/>`}
  else if(m==='blow'){e=dot(-11)+dot(11);mo=`<circle cx="7" cy="-110" r="3.6" fill="#f7b3a8" stroke="${INK}" stroke-width="2.2"/>`}
  else if(m==='happy'){e=arc('M-15,-122 Q-11,-128 -7,-122 M7,-122 Q11,-128 15,-122');mo=`<path d="M-8,-113 Q0,-101 8,-113Z" fill="#b9504a" ${ST}/>`}
  else if(m==='sleepy'){e=arc('M-15,-123 Q-11,-119 -7,-123 M7,-123 Q11,-119 15,-123');mo=`<ellipse cx="0" cy="-109" rx="5.5" ry="7.5" fill="#9e443f" ${ST}/>`}
  else{e=dot(-11)+dot(11);mo=arc('M-7,-113 Q0,-106 7,-113')}
  return e+mo+blush;
}
function hairBack(k,back){
  const h=k.hair;
  if(k.style==='bob')return `<path d="M-34,-126 Q-36,-164 0,-164 Q36,-164 34,-126 L34,-102 Q22,-98 18,-106 L-18,-106 Q-22,-98 -34,-102Z" fill="${h}" ${ST}/>`;
  if(k.style==='long')return `<path d="M-34,-126 Q-36,-164 0,-164 Q36,-164 34,-126 L37,-84 Q24,-80 20,-94 L-20,-94 Q-24,-80 -37,-84Z" fill="${h}" ${ST}/>`;
  let s=`<path d="M-33,-124 Q-34,-162 0,-162 Q34,-162 33,-124Z" fill="${h}" ${ST}/>`;

/* ---------- the book, one opened spread per row ---------- */
const rows=[
 {label:'표지',L:'뒤표지',R:'cover',
  memo:'책을 덮었을 때 오른쪽 면이 앞표지예요. 세 친구와 비눗방울을 한 장에 담고, 제목이 들어갈 하늘을 넓게 비워 두었어요.'},
 {label:'1쪽',L:'면지',R:'park',
  memo:'표지를 넘기면 왼쪽은 면지(색지)이고, 오른쪽 1쪽부터 이야기가 시작돼요. 길이 안쪽으로 이어지게 그려서 이야기 속으로 걸어 들어가는 느낌을 주었어요.'},
 {label:'2–3쪽',L:'meet',R:'tada',
  memo:'마주 보는 두 쪽이에요. 왼쪽은 우연한 만남, 오른쪽은 솔이 엄마의 ‘짜잔!’ 순간이에요. 아이들 표정을 모두 놀란 얼굴로 맞춰서 기대감을 키웠어요.'},

 {label:'8–9쪽',L:'mom',R:'run',

 {label:'10–11쪽',L:'swing',R:'catch',
  memo:'왼쪽은 그네 전체를 넓게, 오른쪽은 솔이를 크게 당겨 그렸어요. 마주 보는 두 쪽의 크기 차이 덕분에 ‘잡았다!’의 기쁨이 커져요.'},
 {label:'12–13쪽',F:'sky',
  memo:'이야기에서 가장 아름다운 절정이에요. 펼침면 전체를 하늘로 쓰고 아이들은 작은 뒷모습으로 그려서, 읽는 사람도 아이들과 함께 하늘을 올려다보게 했어요.'},
 {label:'14–15쪽',L:'yawn',R:'bye',
  memo:'하늘을 해 질 녘 색으로 바꿔 하루가 끝났음을 알려요. 왼쪽에서 하품이 옮아가고, 오른쪽에서 인사하며 끝나요. 하늘에 남은 비눗방울 하나가 여운을 남겨요.'}
];

const plain=h=>h.replace(/<small>.*?<\/small>/g,'').replace(/<\/(p|li|div)>/g,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
function pageSheet(id,where){
  const s=S[id];P=`${where}-${id}-`;
  const w=s.full?1600:800;
  const svg=`<svg viewBox="0 0 ${w} 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${s.no} 그림">${defs()}${s.draw()}</svg>`;
  return `<div class="sheet ${s.full?'full':''}">${svg}${s.texts.map(x=>`<div class="txt ${x.cls||''}" style="${x.style}">${x.html}</div>`).join('')}</div>`;
}
const blank=n=>`<div class="sheet blank"><span>${n}</span></div>`;
const sideHTML=(v,where)=>S[v]?pageSheet(v,where):blank(v);
function rowHTML(r,where){
  const ids=r.F?[r.F]:[r.L,r.R].filter(v=>S[v]);
  const inner=r.F?pageSheet(r.F,where):sideHTML(r.L,where)+sideHTML(r.R,where);
  const cap=ids.map(id=>`<p><b>${S[id].no}</b>${S[id].cap||S[id].texts.map(t=>plain(t.html)).join(' ')}</p>`).join('');
  return `<div class="row"><div class="lab"><b>${r.label}</b>${r.F?' · 펼침면':''}</div><div class="spreadbox ${r.F?'full':''}">${inner}</div><div class="cap">${cap}</div><p class="rmemo">${r.memo}</p></div>`;
}

/* ---------- views ---------- */
let cur=0;
try{const v=parseInt(localStorage.getItem('mongsil-row'),10);if(v>=0&&v<rows.length)cur=v}catch(e){}
const $=id=>document.getElementById(id);
function show(i){
  cur=Math.max(0,Math.min(rows.length-1,i));
  const r=rows[cur];
  $('stage').innerHTML=rowHTML(r,'f');
  $('pos').innerHTML=`<b>${r.label}</b> <span>(${cur+1}/${rows.length})</span>`;
  $('memo').textContent=r.memo;
  $('prev').disabled=cur===0;$('next').disabled=cur===rows.length-1;
  [...$('dots').children].forEach((d,j)=>d.setAttribute('aria-current',j===cur?'true':'false'));
  try{localStorage.setItem('mongsil-row',String(cur))}catch(e){}
}
$('dots').innerHTML=rows.map(r=>`<button aria-label="${r.label}로 이동"></button>`).join('');
[...$('dots').children].forEach((d,i)=>d.addEventListener('click',()=>show(i)));
$('prev').addEventListener('click',()=>show(cur-1));
$('next').addEventListener('click',()=>show(cur+1));
document.addEventListener('keydown',e=>{if($('v-flip').hidden)return;if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});

$('grid').innerHTML=rows.map((r,i)=>`<button class="cell" data-i="${i}">${rowHTML(r,'g'+i)}</button>`).join('');
$('grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;tab('flip');show(+c.dataset.i);window.scrollTo({top:0})});

  {id:'dahong',why:'빨간 삔과 단풍 색 ‘다홍’에서 따왔어요.',items:[[K.dahong.top,'회색 윗옷'],['#cc4a46','빨강·남색 체크 바지',true],[K.dahong.pin,'빨간 삔']],role:'그네를 밀어 주는 아이'}

$('kids').innerHTML=kidsInfo.map(k=>`<div class="card"><div class="por">${portrait(kid(k.id,0,0,{mood:'happy',aL:20,aR:20}),'-78 -172 156 182',k.id)}</div><h3>${K[k.id].name}</h3><p class="why">${k.why}<br>${k.role}</p><ul>${k.items.map(([c,t,ch])=>`<li>${sw(c)}${t}${ch?'<span class="chg">변경</span>':''}</li>`).join('')}</ul></div>`).join('');
const adultsInfo=[['dad','나리 아빠','초록 점퍼, 안경. 처음부터 나리와 함께 와요.'],['narimom','나리 엄마','베이지 코트, 단발. 중간에 합류해요.'],['solmom','솔이 엄마','겨자색 카디건, 큰 초록 가방. 비눗방울을 모두 챙겨 왔어요.'],['hongmom','다홍 엄마','남색 코트, 올림머리.']];
$('grown').innerHTML=adultsInfo.map(([id,n,d])=>`<div class="card"><div class="por">${portrait(adult(id,0,0,{}),'-64 -276 128 284',id)}</div><h3>${n}</h3><p class="why">${d}</p></div>`).join('');

function tab(name){['flip','grid','cast'].forEach(n=>{$('v-'+n).hidden=n!==name;$('t-'+n).setAttribute('aria-selected',n===name?'true':'false')})}
['flip','grid','cast'].forEach(n=>$('t-'+n).addEventListener('click',()=>tab(n)));
show(cur);
</script>
